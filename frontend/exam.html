<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Portal - Question</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Exam Portal</h1>
  <h2 id="question">Question 1: Explain the concept of machine learning in 100 words.</h2>

  <form id="exam-form">
    <label for="answer">Your answer</label>
    <textarea id="answer" name="answer" placeholder="Type your answer here"></textarea>

    <button type="button" onclick="submitAnswer()">Submit</button>
  </form>

  <script>
      // ---- Mouse capture (Member 2) ----
      let mouseEvents = [];
      window.mouseEvents = mouseEvents;
      let lastMoveLogged = 0;

      document.addEventListener('mousemove', function (e) {
        const now = performance.now();
        if (now - lastMoveLogged < 30) return;   // roughly every 30ms
        lastMoveLogged = now;
        mouseEvents.push({event_type: 'move', x: e.clientX, y: e.clientY, timestamp: now});
      });

      document.addEventListener('click', function (e) {
        mouseEvents.push({event_type: 'click', x: e.clientX, y: e.clientY, timestamp: performance.now()});
      });
    // Placeholder: real submission to the backend comes in Week 4.
    function submitAnswer() {
      alert('Answer submitted! (not yet connected to backend)');
    }
  </script>
</body>
</html>
